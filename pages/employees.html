<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employees — EMS</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="with-sidebar">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-title">EMS</div>
      <div class="brand-subtitle">Employee Management System</div>
    </div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="employees.html" class="active">Employees</a>
      <a href="settings.html">Settings</a>
    </nav>
  </aside>

  <main>
    <div class="page-header">
      <div>
        <h2>Employees</h2>
        <p class="page-subline">Search, add, and manage your team's records.</p>
      </div>
      <button id="add-employee-btn">+ Add Employee</button>
    </div>

    <input type="search" id="search-input" placeholder="Search by name…">

    <div class="panel table-panel">
      <table id="employees-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Department</th>
            <th>Status</th>
            <th>Email</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="employees-table-body">
          <!-- filled in by JS -->
        </tbody>
      </table>

      <p id="empty-state" class="empty-state" style="display:none">No employees found. Try a different search, or add your first employee.</p>
    </div>

    <!-- Add/Edit modal -->
    <dialog id="employee-modal">
      <form id="employee-form">
        <div class="modal-header">
          <h3 id="modal-title">Add Employee</h3>
          <button type="button" id="modal-close" class="modal-close" aria-label="Close">&times;</button>
        </div>

        <label for="emp-name">Name</label>
        <input type="text" id="emp-name" name="name" required>

        <label for="emp-email">Email</label>
        <input type="email" id="emp-email" name="email" required>

        <label for="emp-department">Department</label>
        <select id="emp-department" name="department" required>
          <option value="Engineering">Engineering</option>
          <option value="Design">Design</option>
          <option value="Marketing">Marketing</option>
          <option value="Sales">Sales</option>
          <option value="Finance">Finance</option>
        </select>

        <label for="emp-status">Status</label>
        <select id="emp-status" name="status" required>
          <option value="Active">Active</option>
          <option value="On Leave">On Leave</option>
          <option value="Terminated">Terminated</option>
        </select>

        <div class="modal-actions">
          <button type="button" id="modal-cancel" class="secondary">Cancel</button>
          <button type="submit">Save</button>
        </div>
      </form>
    </dialog>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/employees.js"></script>
</body>
</html>
